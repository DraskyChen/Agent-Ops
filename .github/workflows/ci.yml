name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: pnpm check
      - name: Build Web
        run: pnpm --filter @agent-ops/web build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agent_ops
          POSTGRES_USER: agent_ops
          POSTGRES_PASSWORD: agent_ops_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_ops -d agent_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      minio:
        image: elestio/minio:latest
        env:
          MINIO_ROOT_USER: agent_ops
          MINIO_ROOT_PASSWORD: agent_ops_dev_secret
        command: server /data --console-address ":9001"
        ports:
          - 9000:9000
          - 9001:9001
    env:
      DATABASE_URL: postgres://agent_ops:agent_ops_dev@127.0.0.1:5432/agent_ops
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: agent-ops-content
      S3_ACCESS_KEY: agent_ops
      S3_SECRET_KEY: agent_ops_dev_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: >-
          pnpm --filter @agent-ops/contracts build &&
          pnpm --filter @agent-ops/metrics build
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Run PostgreSQL and MinIO integration tests
        run: pnpm test:integration

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - server
          - worker
          - web
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.target }} image
        run: >-
          docker build
          -f infra/docker/Dockerfile
          --target ${{ matrix.target }}
          -t agent-ops-${{ matrix.target }}:ci
          .


name: Publish SDKs

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality gates
        run: pnpm check
      - name: Verify SDK release metadata
        run: pnpm sdk:check
      - name: Build and smoke-test packages
        run: pnpm sdk:verify
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
          if-no-files-found: error

  node20-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
      - name: Smoke-test npm package on Node.js 20
        run: |
          TEMP_DIR="$(mktemp -d)"
          cd "$TEMP_DIR"
          npm init -y
          npm install "$GITHUB_WORKSPACE/artifacts/sdk/npm/"*.tgz
          cp "$GITHUB_WORKSPACE/scripts/sdk-smoke/typescript.mjs" smoke.mjs
          node smoke.mjs success
          node smoke.mjs failure

  python-smoke:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
      - name: Smoke-test Python wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install artifacts/sdk/python/*.whl
          .venv/bin/python scripts/sdk-smoke/python.py success
          .venv/bin/python scripts/sdk-smoke/python.py failure

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs:
      - verify
      - node20-smoke
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
      - name: Publish npm package
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          TARBALL="$(find artifacts/sdk/npm -name 'agent-ops-otel-sdk-*.tgz' -print -quit)"
          if npm view "agent-ops-otel-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "agent-ops-otel-sdk@$VERSION is already published."
            exit 0
          fi
          npm publish "$TARBALL" --access public --provenance --ignore-scripts

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs:
      - verify
      - node20-smoke
      - python-smoke
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: artifacts/sdk/python
          skip-existing: true

  github-release:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs:
      - publish-npm
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/sdk/npm/*.tgz \
              artifacts/sdk/python/*.whl \
              artifacts/sdk/python/*.tar.gz \
              artifacts/sdk/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/sdk/npm/*.tgz \
              artifacts/sdk/python/*.whl \
              artifacts/sdk/python/*.tar.gz \
              artifacts/sdk/SHA256SUMS \
              --verify-tag \
              --title "Agent Ops SDK $GITHUB_REF_NAME" \
              --generate-notes
          fi

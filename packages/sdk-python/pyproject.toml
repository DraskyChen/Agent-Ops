[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-otel-sdk"
dynamic = ["version"]
description = "Thin OpenTelemetry SDK for Agent Ops"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Agent Ops Contributors" },
]
keywords = ["agent", "observability", "opentelemetry", "tracing", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/DraskyChen/Agent-Ops#readme"
Repository = "https://github.com/DraskyChen/Agent-Ops"
Issues = "https://github.com/DraskyChen/Agent-Ops/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "agent_ops._version.__version__" }

[tool.setuptools.package-data]
agent_ops = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_ops"]


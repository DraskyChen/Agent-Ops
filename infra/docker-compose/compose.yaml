name: agent-ops

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: agent_ops
      POSTGRES_USER: agent_ops
      POSTGRES_PASSWORD: agent_ops_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ops -d agent_ops"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agent_ops_postgres:/var/lib/postgresql/data

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: agent_ops
      MINIO_ROOT_PASSWORD: agent_ops_dev_secret
    volumes:
      - agent_ops_minio:/data

volumes:
  agent_ops_postgres:
  agent_ops_minio:


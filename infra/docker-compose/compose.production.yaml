name: agent-ops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent_ops_postgres:/var/lib/postgresql/data

  minio:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - agent_ops_minio:/data

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: server
    restart: "no"
    command: ["node", "apps/server/dist/db/migrate.js"]
    environment: &agent_ops_environment
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENT_OPS_AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-groups}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-agent-ops-admins}
      OIDC_REVIEWER_GROUPS: ${OIDC_REVIEWER_GROUPS:-agent-ops-reviewers}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-agent-ops-content}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: server
    restart: unless-stopped
    init: true
    environment:
      <<: *agent_ops_environment
      AGENT_OPS_SERVER_HOST: 0.0.0.0
      AGENT_OPS_SERVER_PORT: "4318"
      AGENT_OPS_SESSION_TTL_HOURS: ${AGENT_OPS_SESSION_TTL_HOURS:-8}
      AGENT_OPS_INGEST_TOKEN: ${AGENT_OPS_INGEST_TOKEN:?AGENT_OPS_INGEST_TOKEN is required}
      TRACE_MAX_LATENESS_HOURS: ${TRACE_MAX_LATENESS_HOURS:-24}
      S3_CONTENT_MAX_BYTES: ${S3_CONTENT_MAX_BYTES:-2097152}
      S3_CONTENT_RETENTION_DAYS: ${S3_CONTENT_RETENTION_DAYS:-30}
      DATASET_CONTENT_RETENTION_DAYS: ${DATASET_CONTENT_RETENTION_DAYS:-180}
      EVALUATION_JUDGE_ENABLED: ${EVALUATION_JUDGE_ENABLED:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4318/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      <<: *agent_ops_environment
      WORKER_DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-5}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
      TRACE_ROOT_SEAL_GRACE_MS: ${TRACE_ROOT_SEAL_GRACE_MS:-120000}
      TRACE_IDLE_TIMEOUT_MS: ${TRACE_IDLE_TIMEOUT_MS:-900000}
      CONTENT_CLEANUP_INTERVAL_MS: ${CONTENT_CLEANUP_INTERVAL_MS:-900000}
      EVALUATION_JUDGE_ENABLED: ${EVALUATION_JUDGE_ENABLED:-false}
      JUDGE_CONTENT_RETENTION_DAYS: ${JUDGE_CONTENT_RETENTION_DAYS:-180}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-60000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    ports:
      - "${AGENT_OPS_WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  agent_ops_postgres:
  agent_ops_minio:

